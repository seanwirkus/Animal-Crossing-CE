name: Luau CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Install Aftman
        run: |
          curl -fsSL https://github.com/LPGhatguy/aftman/releases/download/v0.3.0/aftman-0.3.0-linux-x86_64.zip -o aftman.zip
          unzip aftman.zip -d aftman-bin
          mkdir -p "$HOME/.local/bin"
          install aftman-bin/aftman $HOME/.local/bin/aftman
          echo "$HOME/.aftman/bin" >> "$GITHUB_PATH"

      - name: Install toolchain
        run: |
          $HOME/.local/bin/aftman install

      - name: Run static checks
        run: bash tools/run_static_checks.sh
